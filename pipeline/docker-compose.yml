name: aciege-pipeline

x-app-env: &app-env
  APP_DB_HOST: postgres
  APP_DB_PORT: "5432"
  APP_DB_NAME: ${POSTGRES_DB:-aciege}
  APP_DB_USER: ${POSTGRES_USER:-aciege}
  APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-aciege}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
  MINIO_BUCKET_THESES: ${MINIO_BUCKET_THESES:-theses}
  MINIO_BUCKET_RAPPORTS: ${MINIO_BUCKET_RAPPORTS:-rapports}
  THESAURUS_CSV: /opt/thesaurus/concepts_flat.csv
  HF_TOKEN: ${HF_TOKEN:-}
  EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
  LLM_MODEL: ${LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
  MAX_PAGES: ${MAX_PAGES:-5}
  MIN_CHARS_INFORMATIF: ${MIN_CHARS_INFORMATIF:-1200}
  BATCH_SIZE: ${BATCH_SIZE:-1000}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aciege}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aciege}
      POSTGRES_DB: ${POSTGRES_DB:-aciege}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aciege}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio12345} &&
      mc mb -p local/${MINIO_BUCKET_THESES:-theses} &&
      mc mb -p local/${MINIO_BUCKET_RAPPORTS:-rapports} &&
      echo 'Buckets prêts.'
      "

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: standalone
    environment:
      <<: *app-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-aciege}:${POSTGRES_PASSWORD:-aciege}@postgres:5432/airflow
      PYTHONPATH: /opt/airflow/src
      HF_HOME: /opt/hf-cache
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ../thesaurus:/opt/thesaurus:ro
      - hf-cache:/opt/hf-cache
    ports:
      - "8080:8080"   # UI Airflow

  review:
    build:
      context: .
      dockerfile: app/Dockerfile.app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ../thesaurus:/opt/thesaurus:ro
    ports:
      - "8501:8501"   # Interface (thésaurus, suivi, revue)

volumes:
  pgdata:
  minio-data:
  hf-cache:
